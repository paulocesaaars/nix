{% extends "base.html" %}
{% block content %}
<h1>Sincronizar</h1>
{% if notice %}
<p><strong>Aviso:</strong> {{ notice }}</p>
{% endif %}
{% if hint %}
<p>{{ hint }}</p>
{% endif %}
<p>A prévia só mostra o que mudaria. A sincronização grava o índice.</p>
<form method="post" action="/sync/preview" hx-post="/sync/preview" hx-target="#preview" hx-swap="innerHTML">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <button type="submit">Prévia</button>
</form>
<div id="preview"></div>
<div id="job">
  {% if running %}
  {% include "sync_stream.html" %}
  {% endif %}
</div>
{% endblock %}
