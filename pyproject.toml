[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nix"
version = "3.0.0"
description = "Servidor MCP stdio para vaults do Obsidian"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Paulo" }]
license = { text = "MIT" }

[project.scripts]
nix = "nix_launch:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nix_launch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nix = ["py.typed", "cli/ascii-art.txt", "web/templates/*.html", "web/static/*", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
extend-include = ["__main__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["E402"]
"scripts/bootstrap.py" = ["E402"]
"scripts/uninstall.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["nix", "nix_launch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "bdd(id): cenário do BDD.md coberto pelo teste (ex.: \"HU-03.2\")",
    "slow: usa recurso pesado (modelo de embedding real); fora do pre-commit",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["nix"]
modules = ["nix_launch"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
    "fastembed",
    "fastembed.*",
    "frontmatter",
    "yaml",
    "yaml.*",
    "mcp",
    "mcp.*",
    "pypdf",
    "pypdf.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
