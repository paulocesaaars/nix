name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente a (re)publicar, ex.: v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag '$TAG' inválida. Use o formato vX.Y.Z (ex.: v0.1.0)."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Conferir versão do pacote
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/check_version.py "$VERSION"

      - name: Verificar lint e tipos
        run: |
          ruff check src scripts
          mypy src

      - name: Montar pacote zip
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ZIP="nix-${VERSION}.zip"
          git archive --format=zip --prefix="nix-${VERSION}/" -o "$ZIP" HEAD
          sha256sum "$ZIP" > "${ZIP}.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "${ZIP}.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" \
              --title "Nix $TAG" \
              --generate-notes
          fi
