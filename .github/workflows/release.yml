name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente a (re)publicar, ex.: v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolver tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag '$TAG' inválida. Use o formato vX.Y.Z (ex.: v1.2.3)."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Conferir versão do pacote
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/check_version.py "$VERSION"

      - name: Verificar lint e tipos
        run: |
          ruff check src scripts
          mypy src

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-arm64 e darwin-amd64 não são publicados; o instalador recusa essas arquiteturas.
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependências de linkagem
        if: runner.os == 'Linux'
        run: |
          packages="patchelf ccache gcc"
          if [ "$(uname -m)" = "aarch64" ]; then
            packages="$packages lld"
          fi
          sudo apt-get update
          sudo apt-get install -y $packages

      - name: Compilador MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar o Nix e o Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          # 4.3 trata a dylib do onnxruntime no macOS e inclui as tabelas unicode do Rich.
          pip install "nuitka[onefile]>=4.3.1,<5"

      - name: Compilar binário
        run: python scripts/build_frozen.py

      - name: Assinar ad-hoc no macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="$(tr -d '\r' < dist/asset-name.txt)"
          codesign --sign - --force "dist/${name}"

      - name: Smoke
        shell: bash
        env:
          # O runner Windows captura o passo por pipe em cp1252. Sem isto o
          # Python do smoke quebra (ou troca letras) ao imprimir o relatório.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          name="$(tr -d '\r' < dist/asset-name.txt)"
          python scripts/smoke_frozen.py "dist/${name}" "${{ needs.check.outputs.version }}"

      - name: Nome do artefato
        id: binary
        shell: bash
        run: |
          name="$(tr -d '\r' < dist/asset-name.txt)"
          echo "path=dist/${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nix-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.binary.outputs.path }}
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nix-*
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum nix-* | tee checksums.txt

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$REPO" \
              --title "Nix $TAG" \
              --generate-notes
          fi
